dataset:
  augmentation: standard_cifar10
  batch_size: 128
  image_size: 32
  name: CIFAR10
  num_classes: 10
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  root: data
  validation_fraction: 0.1
environment:
  gpu: NVIDIA RTX 4500 Ada Generation
  gpu_memory_gib: 23.52
  nvidia_driver_version: 595.91.07
  nvidia_smi_cuda_compatibility: 13.2
  python_environment_name: ia
  python_environment_type: python_venv
  python_version: 3.12.3
  pytorch_cuda_build: 12.8
  pytorch_version: 2.10.0+cu128
  workstation: Lenovo ThinkStation-P720
evaluation:
  feature_layer: final_pre_classifier
  latency_batch_sizes:
  - 1
  - 128
  latency_iterations: 1000
  latency_warmup: 100
  measure_flops: true
  measure_latency: true
  test_at_end_only: true
experiment:
  deterministic: true
  name: cifar10_canet
  output_dir: outputs/cifar10_canet
  seeds:
  - 2026
  - 42
  - 123
  - 456
  - 789
model:
  backbone: CANet
  beta_max: 2.0
  blocks_per_stage:
  - 2
  - 2
  dynamic_beta: true
  dynamic_q: true
  groups: 4
  hrg_after_each_block: true
  q_mode: qr
  rank: 4
  stage_channels:
  - 64
  - 128
  stem_channels: 64
  value_map_type: grouped_conv
runtime:
  benchmark: false
  device: cuda
  matmul_precision: high
  use_amp: false
stability:
  divergence_loss_threshold: 100.0
  divergence_patience_epochs: 3
training:
  checkpoint_metric: validation_accuracy
  epochs: 100
  gradient_clip_norm: 1.0
  lr: 0.1
  momentum: 0.9
  optimizer: sgd
  scheduler: cosine
  weight_decay: 0.0005
