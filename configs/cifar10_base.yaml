experiment:
  name: cifar10_hrgdelta_base
  output_dir: outputs/cifar10_hrgdelta_base
  seeds: [2026, 42, 123, 456, 789]
  deterministic: true

environment:
  workstation: Lenovo ThinkStation-P720
  gpu: NVIDIA RTX 4500 Ada Generation
  gpu_memory_gib: 23.52
  python_environment_type: python_venv
  python_environment_name: ia
  python_version: 3.12.3
  pytorch_version: 2.10.0+cu128
  pytorch_cuda_build: 12.8
  nvidia_driver_version: 595.91.07
  nvidia_smi_cuda_compatibility: 13.2

runtime:
  device: cuda
  use_amp: false
  matmul_precision: high
  benchmark: false

dataset:
  name: CIFAR10
  root: data
  num_classes: 10
  image_size: 32
  batch_size: 128
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  validation_fraction: 0.1
  augmentation: standard_cifar10

model:
  backbone: ResNet8
  stem_channels: 64
  stage_channels: [64, 128]
  blocks_per_stage: [2, 2]
  hrg_after_each_block: true
  rank: 4
  groups: 4
  dynamic_q: true
  dynamic_beta: true
  beta_max: 2.0
  value_map_type: grouped_conv
  q_mode: qr

training:
  epochs: 100
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: cosine
  gradient_clip_norm: 1.0
  checkpoint_metric: validation_accuracy

evaluation:
  test_at_end_only: true
  measure_flops: true
  measure_latency: true
  latency_batch_sizes: [1, 128]
  latency_warmup: 100
  latency_iterations: 1000
  feature_layer: final_pre_classifier

stability:
  divergence_loss_threshold: 100.0
  divergence_patience_epochs: 3
